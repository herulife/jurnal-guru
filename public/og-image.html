<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  .container {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #1A2332 0%, #0A6352 50%, #062e24 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .circle1 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(232, 163, 23, 0.15);
    top: -100px;
    right: -50px;
  }
  .circle2 {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(13, 124, 102, 0.3);
    bottom: -80px;
    left: -50px;
  }
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px;
    max-width: 900px;
  }
  .badge {
    display: inline-block;
    background: #E8A317;
    color: #1A2332;
    font-size: 16px;
    font-weight: 700;
    border-radius: 30px;
    padding: 8px 24px;
    margin-bottom: 30px;
  }
  h1 {
    color: white;
    font-size: 48px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  h1 span { color: #E8A317; }
  p {
    color: rgba(255,255,255,0.75);
    font-size: 22px;
    line-height: 1.5;
    margin-bottom: 40px;
  }
  .cta {
    display: inline-block;
    background: #E8A317;
    color: #1A2332;
    font-size: 20px;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 12px;
  }
  .footer {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="content">
    <div class="badge">GRATIS untuk semua guru</div>
    <h1>Dashboard Guru untuk Kelola<br><span>Absensi, Nilai, & Jurnal</span></h1>
    <p>Masih admin manual? Waktu habis untuk administrasi?<br>Jurnal Guru bantu semuanya — gratis.</p>
    <div class="cta">Coba Gratis Sekarang</div>
  </div>
  <div class="footer">Jurnal Guru — Dashboard Guru Indonesia</div>
</div>
</body>
</html>
